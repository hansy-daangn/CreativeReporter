   출발 점수 = 이 소재의 '첫 K주' 성과를 다른 소재들의 '첫 K주' 분포에서 매긴 백분위(0~100).
   · 규모 축 없음 — 신규가 작은 건 흠이 아니다(효율만 본다)
   · 축소 완화(0.5+0.5·w) — 비교군도 같은 K주 표본이라 소표본 비대칭이 없다(기존은 성숙 소재와 겨뤄 강한 축소가 필수였음)
   · 동적 가중(w에 비례) — 노출 기반 지표(CTR·CPM)는 신규 구간에도 표본이 충분해 먼저 말하고,
     전환 단가류는 증거가 쌓이는 만큼만 반영. 지표별 표본 성숙 속도 차이를 점수에 반영하는 장치.
     **새 지표를 끌어오지 않는다** — 매체별로 이미 검증된 스펙(specsFor)만 쓰고 가중만 조절한다.
     하한 0.35 덕에 1순위 지표는 증거가 0이어도 주도권을 잃지 않는다(예: AEO 신규단가 .64×.35=.224 > CTR .12×1=.12).
     이 코드베이스는 'CTR↔eCPA 비상관' 같은 걸 실측해 둔 곳이라, 조기 대리지표로 순위를 뒤집는 설계는 위험하다.
   · 추세(궤적)는 점수에 넣지 않는다 — 3주 이하 구간의 초기 기울기는 이후 성과와 사실상 무상관이라
     섞으면 정확도가 오히려 떨어진다(수준만 쓸 때 대비 하락). 추세는 상세의 주차별 추이가 담당.
   기존 점수와 역할이 다르므로 라벨·툴팁에서 '출발 점수'로 분리 표기한다. */
const NR_WIN=3;            /* 첫 집행이 최근 3주 이내면 '신규' */
const NR_MIN_COST=30000;   /* 점수 산출 최소 광고비 — 미만은 '관찰중'(표기만) */
const NR_MIN_POOL=8;       /* 같은 출발선 비교군 최소 표본 */
function nrAddDays(d,n){const p=String(d).split("-").map(Number);const t=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));
  const z=x=>String(x).padStart(2,"0");return `${t.getUTCFullYear()}-${z(t.getUTCMonth()+1)}-${z(t.getUTCDate())}`;}
function nrRowsOf(ds){return (dsMode==="channeled"&&ds.media)?ds.dataAll.filter(r=>r._ch===ds.media):ds.dataAll;}
function nrNameOf(r,nameCol){let nm=r[nameCol];return(nm==null||nm===""||nm==="nan")?"(미지정)":nm;}
/* 소재별 집행 주 목록 — 반드시 '전체 이력(dataAll)' 기준.
   기간 필터된 ds.data로 계산하면 '최근 1달' 스코프에서 오래된 소재까지 전부 신규로 오인된다 */
function nrHistory(ds){
  const key=(ds.media||"")+"|"+(ds.dataAll?ds.dataAll.length:0);
  if(ds._nrHist&&ds._nrHistKey===key)return ds._nrHist;
  const nameCol=ds.L.nameCol,m=new Map();
  for(const r of nrRowsOf(ds)){const c=num(r["비용"]);if(!(c>0))continue;
    const d=String(r.date||"").slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
    const nm=nrNameOf(r,nameCol);let s=m.get(nm);if(!s){s=new Set();m.set(nm,s);}s.add(d);}
  const out=new Map();for(const[nm,s]of m)out.set(nm,[...s].sort());
  ds._nrHist=out;ds._nrHistKey=key;ds._nrPool={}; /* 이력이 바뀌면 파생 풀도 함께 폐기(세션 누적 방지) */
  return out;}
/* 같은 출발선 비교군 — 모든 소재의 '첫 K주' 행만 모아 재집계.
   aggregate()를 그대로 쓰므로 파생지표(단가·비율)가 분자·분모 합산 기준으로 정확히 재계산된다 */
function nrPool(ds,K,hist){
  const ck=(ds.media||"")+"|"+K+"|"+(ds.dataAll?ds.dataAll.length:0);
  ds._nrPool=ds._nrPool||{};if(ds._nrPool[ck])return ds._nrPool[ck];
  const keep=new Set();
  for(const[nm,wks]of hist){if(wks.length<K)continue;for(let i=0;i<K;i++)keep.add(nm+"\u0000"+wks[i]);}
  const nameCol=ds.L.nameCol;
  const sub=nrRowsOf(ds).filter(r=>keep.has(nrNameOf(r,nameCol)+"\u0000"+String(r.date||"").slice(0,10)));
  const agg=aggregate(sub,ds.L);ds._nrPool[ck]=agg;return agg;}
/* 출발 점수 — 같은 K주 비교군 안에서의 가중 백분위 합성.
   채점 대상도 비교군과 **같은 '첫 K주' 집계본(pe)** 을 쓴다 — 화면 기간 필터가 신규 소재의 생애를
   잘라도(예: '최근 1주' 설정) 대상만 2주치, 비교군은 3주치로 어긋나는 비대칭이 생기지 않는다. */
function nrScore(ds,e,K,hist,specs){
  const pool=nrPool(ds,K,hist);
  if(pool.length<NR_MIN_POOL)return{err:"pool"};
  const pe=pool.find(x=>x.name===e.name)||e;
  const gOf=(typeof groupOfFor==="function")?groupOfFor(ds):null; /* 구글=애드그룹 단위(D3) */
  const myG=gOf?gOf(pe):null;
  let comp=0,wsum=0,confNum=0,basis="매체 전체";const parts=[];
  for(const s of specs){
    if(pe[s.k]==null)continue;
    if(s.entFo&&((pe.tags&&pe.tags.fo)||"")!==s.entFo)continue; /* 포맷 조건부(예: AEO CTR=영상만) — 본 채점과 동일 */
    if(s.entCt&&String(pe._m_ctype||"")!==s.entCt)continue;     /* 지면 조건부(몰로코 CTR=외부 지면 이미지) */
    const base=pool.filter(x=>x[s.k]!=null&&x.name!==pe.name);
    let cand=base,how="매체 전체";
    /* 구글은 본 채점(D3)과 같이 같은 애드그룹 안에서 비교 — 경매·인벤토리가 그룹마다 달라 그룹 간 레벨 비교는 무효.
       단 신규 구간엔 그룹 내 같은 나이 표본이 8개 미만인 경우가 흔해, 그때만 매체 전체로 넓히고 그 사실을 툴팁에 밝힌다 */
    if(myG!=null){const sg=base.filter(x=>gOf(x)===myG);if(sg.length>=NR_MIN_POOL){cand=sg;how="그룹 내";}}
    else if(MEDIA_COHORT_KEYS.has(s.k)){ /* 인벤토리가 다른 영상/이미지는 같은 포맷끼리만(본 채점과 동일 규칙) */
      const fo=specCohortOf(s,pe),same=base.filter(x=>specCohortOf(s,x)===fo);
      if(same.length>=NR_MIN_POOL){cand=same;how="같은 포맷";}}
    if(cand.length<NR_MIN_POOL)continue;
    const d=buildWDist(cand.map(x=>[x[s.k],1])); /* 소재 1개=1표 — 본 채점의 D5 등수화와 동일 */
    const p=wPctRank(d,pe[s.k]);
    const w=evidenceW(pe,s.k);
    const g=0.5+((s.dir<0?1-p:p)-0.5)*(0.5+0.5*w);
    const wt=s.w*(0.35+0.65*w);
    comp+=g*wt;wsum+=wt;confNum+=w*wt;basis=how;
    parts.push({lab:s.lab,k:s.k,g,w,dir:s.dir,v:pe[s.k],n:cand.length,how});}
  if(wsum<=0)return{err:"metric"};
  const E=comp/wsum;
  parts.sort((a,b)=>Math.abs(b.g-0.5)-Math.abs(a.g-0.5)); /* 점수를 가장 크게 움직인 지표 순 */
  return{score:Math.round(Math.max(2,Math.min(99,E*100))),conf:confNum/wsum,parts,basis,
    cmpN:Math.min.apply(null,parts.map(p=>p.n)),pe};}
function nrTier(sc){return sc>=72?"g2":sc>=58?"g1":sc>=43?"m":sc>=30?"w1":"w2";}
function nrVerdict(sc){return sc>=72?"좋은 출발":sc>=58?"순항":sc>=43?"보통":sc>=30?"주의":"부진";}
/* 신규 소재 목록 — 전체 이력 기준 첫 집행이 최근 NR_WIN주 이내 */
function newCreatives(ds){
  if(!ds||!ds.agg||standaloneMode)return null;
  const hist=nrHistory(ds);if(!hist.size)return null;
  let latest="";for(const wks of hist.values()){const w=wks[wks.length-1];if(w>latest)latest=w;}
  if(!latest)return null;
  const cut=nrAddDays(latest,-(NR_WIN-1)*7);
  /* 좌측 절단(left truncation) 가드 — 저장된 첫 주에 이미 돌고 있던 소재는 그 주가 '데뷔'인지
     그 전부터 돌던 건지 알 수 없다. 이력이 짧은 매체(막 올린 채널 등)에선 이 구분이 없으면
     전 소재의 첫 주가 창 안에 들어와 '신규'가 통째로 폭발한다. 저장 시작 주 소재는 판정에서 제외. */
  let dataFirst="";for(const wks of hist.values()){const w=wks[0];if(!dataFirst||w<dataFirst)dataFirst=w;}
  const byName=new Map();for(const e of ds.agg)if(!e._isGroup)byName.set(e.name,e);
  const out=[];let truncated=0;
  for(const[nm,wks]of hist){
    if(wks[0]<cut)continue;                 /* 첫 집행이 창 밖 = 신규 아님 */
    if(wks[0]===dataFirst){truncated++;continue;} /* 데뷔 시점 불명(저장 시작 주) */
    const e=byName.get(nm);if(!e||!(e.비용>0))continue; /* 현재 기간 필터에 안 잡히면 제외(화면 일관성) */
    out.push({e,name:nm,K:wks.length,first:wks[0],live:wks[wks.length-1]===latest});}
  return{latest,cut,dataFirst,truncated,items:out};}
function renderNewRadar(ds){
  const el=$("#newRadar");if(!el)return;
  const info=newCreatives(ds);
  if(!info){el.hidden=true;el.innerHTML="";return;}
  el.hidden=false;
  const specs=(typeof specsFor==="function"?specsFor(ds):[])||[];
  const hist=nrHistory(ds);
  const scored=info.items.map(it=>{
    let r=null,why="cost";
    if(!specs.length)why="metric";
    else if(it.e.비용>=NR_MIN_COST){const t=nrScore(ds,it.e,it.K,hist,specs);if(t&&t.score!=null)r=t;else why=(t&&t.err)||"metric";}
    return Object.assign({},it,{r,why});});
  /* 점수 높은 순 — 점수 있는 것 먼저(내림차순), 관찰중(점수 없음)은 광고비 순으로 뒤에 */
  scored.sort((a,b)=>(a.r?0:1)-(b.r?0:1)||(b.r&&a.r?b.r.score-a.r.score:0)||(b.e.비용||0)-(a.e.비용||0));
  const shown=scored;
  const head=`<div class="nrad-h">🌱 새로 시작한 소재 <span class="n">최근 ${NR_WIN}주 · ${info.items.length}개</span></div>`;
  if(!info.items.length){
    const why=info.truncated>0
      ?`저장된 첫 주(${String(info.dataFirst).slice(5).replace("-","/")})부터 돌던 소재 ${info.truncated}개는 데뷔 시점을 알 수 없어 판정에서 빼요.<br>주간 데이터가 더 쌓이면 이 자리에 새 소재가 보여요.`
      :`새 소재가 집행되면 여기서 <b>출발 점수</b>로 초기 성과를 바로 확인할 수 있어요.`;
    el.innerHTML=head+`<div class="nrad-empty">최근 ${NR_WIN}주 안에 새로 시작한 소재가 없어요.<br>${why}</div>`;return;}
  const rows=shown.map(x=>{
    const dn=displayNameOf(x.e),sc=x.r?x.r.score:null;
    const cls=sc==null?"t-na":"t-"+nrTier(sc);
    const lab=sc==null?"관찰<br>중":String(sc);
    const drv=x.r&&x.r.parts.length?x.r.parts[0]:null;
    /* 지표명 옆 표기는 '우수/저조'(성과 방향) — 화살표는 이 앱에서 이미 '↓=낮을수록 좋음'(지표 성격)을
       뜻하므로, 같은 자리에 성과 방향으로 쓰면 단가류(dir<0)에서 정반대로 읽힌다 */
    const cost=x.r&&x.r.pe?(x.r.pe.비용||0):(x.e.비용||0); /* 점수와 같은 '첫 K주' 기준 금액 */
    const sub=[`${x.K}주차`,fmtWon(cost),drv?`${drv.lab} ${drv.g>=0.5?"우수":"저조"}`:null].filter(Boolean).join(" · ");
    const tip=x.r
      ?`출발 점수 ${sc} — ${nrVerdict(sc)}\n같은 나이(첫 ${x.K}주) 소재 ${x.r.cmpN}개(${x.r.basis})와 비교한 상대 위치예요.\n${x.r.parts.map(p=>`· ${p.lab}: ${fmtSpecVal(p.k,p.v)} → ${Math.round(p.g*100)}점 (증거 ${Math.round(p.w*100)}% · 비교 ${p.n}개 ${p.how})`).join("\n")}\n신뢰도 ${Math.round(x.r.conf*100)}% · 규모는 점수에서 제외(신규는 작은 게 정상)\n※ 전체목록의 '점수'와는 다른 기준이에요 — 클릭하면 이 소재로 이동`
      :(x.why==="cost"
        ?`아직 광고비 ${fmtWon(x.e.비용)}로 표본이 적어 점수를 내지 않았어요(${fmtWon(NR_MIN_COST)} 이상부터).\n클릭하면 이 소재로 이동`
        :x.why==="pool"
        ?`같은 나이(첫 ${x.K}주) 비교군이 ${NR_MIN_POOL}개 미만이라 아직 상대 평가를 하지 않았어요.\n클릭하면 이 소재로 이동`
        :`채점에 쓸 핵심 지표가 아직 안 잡혔어요(전환이 0건이면 단가가 정의되지 않아요).\n클릭하면 이 소재로 이동`);
    return `<div class="nrad-it" role="button" tabindex="0" data-nm="${escAttr(x.name)}" title="${escAttr(tip)}">`
      +`<span class="nrad-sc ${cls}">${lab}</span>`
      +`<span class="nrad-b"><span class="nrad-nm">${x.live?'<span class="lvb"></span>':""}${escHtml(trunc(dn,26))}</span><span class="nrad-sub">${escHtml(sub)}</span></span></div>`;}).join("");
  el.innerHTML=head+`<div class="nrad-list">${rows}</div>`
    +`<div class="nrad-foot">출발 점수 = 같은 나이(첫 K주) 소재들과 비교한 초기 성과. 규모는 빼고 효율만 봐요 — 전체목록 점수와 기준이 달라요.</div>`;
  el.querySelectorAll(".nrad-it").forEach(it=>{
    const go=()=>{const nm=it.dataset.nm;if(nm)goToIslandFromQuad(nm);};
    it.onclick=go;
    it.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go();}};});}

/* 유형별 집계 — 효율 지도 '보기' 세그먼트용 (구 유형별 비교 그래프를 지도에 흡수).
   비율 지표는 상하 10% 트림 후 합산 기반으로 계산해 이상치 소재가 유형 평균을 흔들지 못하게 한다 */
function typeAggRows(ds,dim){const a=ds.agg;
  function trimMet(arr,valFn,numFn,denFn){
    const items=arr.map(e=>{const v=valFn(e),n=numFn(e)||0,d=denFn(e)||0;return{v,n,d};}).filter(x=>x.v!=null&&x.v>0&&x.d>0);
    if(!items.length)return null;
    let kept=items;
    if(items.length>=10){items.sort((a,b)=>a.v-b.v);const cut=Math.floor(items.length*0.1);kept=items.slice(cut,items.length-cut);}
    const num=kept.reduce((s,x)=>s+x.n,0),den=kept.reduce((s,x)=>s+x.d,0);
    return den>0?num/den:null;}
  const g={};a.forEach(e=>{const k=e.tags&&e.tags[dim];if(!k)return;(g[k]=g[k]||[]).push(e);});
  return Object.entries(g).map(([k,arr])=>({
    name:k,n:arr.length,
    비용:arr.reduce((s,e)=>s+(e.비용||0),0),
    "노출 수":arr.reduce((s,e)=>s+(e["노출 수"]||0),0),
    CPC:trimMet(arr,e=>e.CPC,e=>e.비용,e=>e["클릭 수"]),
    CTR:trimMet(arr,e=>e.CTR,e=>e["클릭 수"],e=>e["노출 수"]),
    CPM:trimMet(arr,e=>e["노출 수"]>0?e.비용/e["노출 수"]*1000:null,e=>e.비용*1000,e=>e["노출 수"]),
    eCPI:trimMet(arr,e=>e.eCPI,e=>e.비용,e=>e["어트리뷰션 수"]),
    "활성 유저 eCPA":trimMet(arr,e=>e["활성 유저 eCPA"],e=>e.비용,e=>e["활성 유저 수"]),
    _g_interactionRate:trimMet(arr,e=>e._g_interactionRate,e=>e._g_interactions||0,e=>e["노출 수"]),
    _g_conversionRate:trimMet(arr,e=>e._g_conversionRate,e=>e._g_conversions||0,e=>e._g_interactions||0),
    _g_ROAS:trimMet(arr,e=>e._g_ROAS,e=>e._g_convValue||0,e=>e.비용),
    _g_costPerConv:trimMet(arr,e=>e._g_costPerConv,e=>e.비용,e=>e._g_conversions||0),
    _g_cpFirstOpen:trimMet(arr,e=>e._g_cpFirstOpen,e=>e.비용,e=>e._g_firstOpen||0),
    _g_cpHome:trimMet(arr,e=>e._g_cpHome,e=>e.비용,e=>e._g_home||0),
    _g_hpm:trimMet(arr,e=>e._g_hpm,e=>(e._g_home||0)*1000,e=>e["노출 수"]),
    _g_convValuePerConv:trimMet(arr,e=>e._g_convValuePerConv,e=>e._g_convValue||0,e=>e._g_allConv||0),
    "영상 완주율":trimMet(arr,e=>e["영상 완주율"],e=>e._vcrNum||0,e=>e._vcrDen||0),
    "신규+재활성 eCPA":trimMet(arr,e=>e["신규+재활성 eCPA"],e=>e.비용,e=>e["신규+재활성 유저 수"]||0)}));}

/* table — paginated */
let tState={sort:"비용",dir:-1,q:""};

/* ═════ 비교군 내 위치 — 같은 광고그룹 / 같은 서비스에서 이 소재의 수준 ═════

function peerRankHTML(ds,e){
  if(!ds||!e||e._isGroup)return "";

     채점용 규모축(reachKeyFor)은 구글에서 노출이라 여기 쓰지 않는다(사용자가 보는 '데려온 유저'와 어긋남) */
  const rk=(ds.agg||[]).some(p=>p&&p._g_firstOpen!=null)?"_g_firstOpen"
    :((ds.agg||[]).some(p=>p&&p["신규+재활성 유저 수"]!=null)?"신규+재활성 유저 수":"어트리뷰션 수");
  const rkLab="실유저";
  const pool=(ds.agg||[]).filter(p=>p&&!p._isGroup&&(p.비용||0)>0);
  if(pool.length<4)return "";
  const gid=e._g_adGroupId||e._m_group||null;
  const svc=(typeof svcOf==="function")?svcOf(e):null;
  const groups=[];
  if(gid){const g=pool.filter(p=>String(p._g_adGroupId||p._m_group||"")===String(gid));
    if(g.length>=4){const raw=e._m_group?gid:adGroupLabel(gid);
      groups.push({key:"grp",lab:"같은 광고그룹",sub:raw?trunc(groupPrettyName(raw),20):("그룹 "+String(gid).slice(-4)),list:g});}}
  if(svc){const g=pool.filter(p=>svcOf(p)===svc);
    if(g.length>=4&&(!groups.length||g.length!==groups[0].list.length))groups.push({key:"svc",lab:"같은 서비스",sub:svc,list:g});}
  if(!groups.length){const g=pool;if(g.length>=6)groups.push({key:"all",lab:"이 매체 전체",sub:String(ds.media||""),list:g});}
  if(!groups.length)return "";

    ${rows.map(r=>`<div class="peer-g"><div class="peer-gl" title="${escAttr(r.g.sub)}">${r.g.lab}<em>${r.g.list.length}개</em></div>

     0부터 채우는 막대는 값들이 비슷하면 전부 비슷하게 길어져 자리만 차지하고 변별이 안 된다.

function cmpRank(){
  const ents=cmpEnts();

function googleSubChannel(channel,d,ag2c){

    `<div class="sc-head"><div><div class="sc-ttl">채점 설정</div><div class="sc-sub">매체마다 어떤 지표를 어느 비중으로 채점할지 직접 정해요. <b>저장하면</b> 표·효율지도·상세 점수에 바로 반영돼요. 비중은 각자 독립이라 합이 100%가 아니어도 되고, 저장할 때 자동으로 100%에 맞춰요.</div></div><button type="button" class="sc-close" aria-label="닫기">✕</button></div>`+
    `<div class="sc-tabs" id="scTabs" role="tablist"></div>`+
    `<div class="sc-note" id="scNote"></div>`+
    `<div class="sc-body" id="scBody"></div>`+
    `<div class="sc-err" id="scErr" role="alert" hidden></div>`+
    `<div class="sc-foot"><button type="button" class="sc-reset" id="scReset">↺ 이 매체 기본값</button><div class="sc-foot-sp"></div><button type="button" class="sc-cancel" id="scCancel">취소</button><button type="button" class="sc-save" id="scSave">저장</button></div>`+
  `</div>`;
  document.body.appendChild(ov);
  const tabs=ov.querySelector("#scTabs");
  tabs.innerHTML=SCORE_MEDIA.map(([k,lab])=>`<button type="button" role="tab" data-k="${k}" aria-selected="${k===_scKey}" class="${k===_scKey?"on":""}">${lab}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{_scKey=b.dataset.k;tabs.querySelectorAll("button").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-selected",on);});renderScBody();});
  ov.querySelector(".sc-close").onclick=closeScoreModal;
  ov.querySelector("#scCancel").onclick=closeScoreModal;
  ov.querySelector("#scReset").onclick=()=>{_scDraft[_scKey]=unifiedSpecs(_scKey,true);renderScBody();toast(SCORE_MEDIA.find(m=>m[0]===_scKey)[1]+" 지표를 기본값으로 되돌렸어요");};
  ov.querySelector("#scSave").onclick=()=>{
    /* B6 — 효율 지표가 하나도 안 남은 매체가 있으면 저장 막기(규모만으론 채점 불가) */
    const bad=[];for(const [k,lab] of SCORE_MEDIA){const l=_scDraft[k]||[];if(!l.some(s=>!s.isReach&&s.w>0))bad.push([k,lab]);}
    if(bad.length){const err=$("#scErr");if(err){err.textContent=bad.map(b=>b[1]).join("·")+": 효율 지표를 최소 1개는 남겨 주세요";err.hidden=false;}
      const first=bad[0][0];if(first!==_scKey){_scKey=first;tabs.querySelectorAll("button").forEach(x=>{const on=x.dataset.k===first;x.classList.toggle("on",on);x.setAttribute("aria-selected",on);});renderScBody();}
      return;}
    applyScoreCfg();closeScoreModal();toast("채점 설정을 저장했어요 — 점수를 다시 매겼어요 ✅");};
  ov.addEventListener("click",e=>{if(e.target===ov)closeScoreModal();});
  ov.querySelector(".sc-modal").addEventListener("click",e=>e.stopPropagation());
  _scEsc=e=>{if(e.key==="Escape"){e.stopPropagation();closeScoreModal();}};
  document.addEventListener("keydown",_scEsc,true);
  _scDrag=null;wireScBodyOnce(ov.querySelector("#scBody")); /* 본문 리스너는 모달당 1회만(재렌더 중복 방지) */
  renderScBody();}
function renderScBody(){
  const key=_scKey,list=_scDraft[key],body=$("#scBody"),note=$("#scNote");if(!body)return;
  {const err=$("#scErr");if(err)err.hidden=true;}
  note.textContent=SCORE_NOTE[key]||"";
  const active=new Set(list.map(s=>s.k));
  const avail=catalogKeys(key).filter(k=>!active.has(k));
  const rowsHtml=list.map((s,i)=>{
    const pw=s.w*100,cond=condLabelOf(s);
    return `<div class="sc-row" data-i="${i}">
      <div class="sc-info"><div class="sc-nm">${escHtml(s.lab)}${cond?` <span class="sc-condtag">${escHtml(cond)}만</span>`:""}</div>
        <div class="sc-desc">${escHtml(descOf(s))}</div></div>
      <div class="sc-slider" tabindex="0" role="slider" aria-label="${escAttr(s.lab)} 비중" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pw)}">
        <div class="sc-track"><div class="sc-fill" style="width:${pw.toFixed(1)}%;background:${_scPalette(i)}"></div></div>
        <div class="sc-knob" style="left:${pw.toFixed(1)}%"></div></div>
      <span class="sc-numwrap"><input class="sc-num" type="number" min="0" max="100" step="0.5" value="${fmtScW(s.w)}" aria-label="${escAttr(s.lab)} 비중 퍼센트"></span>
      <button type="button" class="sc-rm" aria-label="${escAttr(s.lab)} 빼기" title="빼기"${(s.isReach||list.filter(x=>!x.isReach).length<=1)?' style="visibility:hidden"':""}>✕</button>
    </div>`;}).join("");
  const isDisc=k=>!!(MET_META[k]&&MET_META[k].disc);
  const chkHtml=(k,disc)=>{const m=MET_META[k]||{lab:k};
    return `<label class="sc-chk${disc?" sc-chk-disc":""}"><input type="checkbox" data-k="${k}"><span class="sc-chk-nm">${escHtml(m.lab)}<em class="sc-chk-desc">${escHtml(m.desc||"")}</em></span><span class="sc-lib-tag">추가</span></label>`;};
  const grpOrder=["eff","quality","reaction"];
  let libInner=grpOrder.map(g=>{
    const items=avail.filter(k=>grpOf(k)===g&&!isDisc(k));if(!items.length)return "";
    return `<div class="sc-lib-grp">${SGROUP[g]}</div>`+items.map(k=>chkHtml(k,false)).join("");
  }).join("");
  const discItems=avail.filter(isDisc);
  if(discItems.length)libInner+=`<div class="sc-lib-grp sc-lib-grp-disc">고급 · 채점 비권장</div>`+discItems.map(k=>chkHtml(k,true)).join("");
  body.innerHTML=`<div class="sc-list">${rowsHtml}</div>`+
    (libInner?`<div class="sc-lib" id="scLib"><button type="button" class="sc-lib-h" id="scLibH" aria-expanded="false" aria-controls="scLibBody"><span>＋ 지표 추가</span><span class="sc-lib-cnt">${avail.length}</span><span class="sc-car">▸</span></button><div class="sc-lib-body" id="scLibBody" hidden>${libInner}</div></div>`
      :`<div class="sc-lib-none">이 매체의 지표를 모두 쓰고 있어요.</div>`);
  wireScLib();}
/* 행 값 표시 갱신 — 항상 현재 매체(_scKey)의 draft를 읽는다 */
function _scUpdateRow(i,exceptInput){const body=$("#scBody");if(!body)return;const s=_scDraft[_scKey][i],r=body.querySelector(`.sc-row[data-i="${i}"]`);if(!s||!r)return;
  {const err=$("#scErr");if(err&&!err.hidden)err.hidden=true;}
  const pw=s.w*100;r.querySelector(".sc-fill").style.width=pw.toFixed(1)+"%";r.querySelector(".sc-knob").style.left=pw.toFixed(1)+"%";
  r.querySelector(".sc-slider").setAttribute("aria-valuenow",String(Math.round(pw)));
  const ni=r.querySelector(".sc-num");if(ni&&ni!==exceptInput)ni.value=fmtScW(s.w);}
/* 라이브러리(열기/닫기·추가) — 매 렌더마다 새 요소라 안전(중복 없음) */
function wireScLib(){
  const libH=$("#scLibH");
  if(libH)libH.onclick=()=>{const b=$("#scLibBody"),open=b.hasAttribute("hidden");if(open){b.removeAttribute("hidden");libH.setAttribute("aria-expanded","true");libH.querySelector(".sc-car").style.transform="rotate(90deg)";}else{b.setAttribute("hidden","");libH.setAttribute("aria-expanded","false");libH.querySelector(".sc-car").style.transform="";}};
  const lib=$("#scLibBody");
  if(lib)lib.onchange=e=>{const cb=e.target.closest("input[type=checkbox]");if(!cb)return;
    const key=_scKey,list=_scDraft[key],k=cb.dataset.k,def=(SCORING[key]||[]).find(s=>s.k===k),m=MET_META[k]||{lab:k,dir:1};
    const spec={k,lab:(def&&def.lab)||m.lab,dir:(def?def.dir:m.dir),w:0.1,grp:grpOf(k)};
    if(def){if(def.entCt)spec.entCt=def.entCt;if(def.entFo)spec.entFo=def.entFo;if(def.videoOnly)spec.videoOnly=def.videoOnly;}else if(m.videoOnly)spec.videoOnly=true;
    const ri=list.findIndex(s=>s.isReach);list.splice(ri<0?list.length:ri,0,spec);renderScBody();};}
/* 본문(슬라이더·숫자·빼기) 리스너 — 모달당 1회만. 현재 매체 draft를 동적으로 읽어 재렌더에도 안전 */
function wireScBodyOnce(body){
  body.addEventListener("input",e=>{const inp=e.target.closest(".sc-num");if(!inp)return;
    const list=_scDraft[_scKey],i=+inp.closest(".sc-row").dataset.i;let v=parseFloat(inp.value);if(isNaN(v))return;
    list[i].w=Math.max(0,Math.min(100,v))/100;_scUpdateRow(i,inp);});
  body.addEventListener("click",e=>{const rm=e.target.closest(".sc-rm");if(!rm)return;
    _scDraft[_scKey].splice(+rm.closest(".sc-row").dataset.i,1);renderScBody();});
  const setFromX=(i,cx,slider)=>{const list=_scDraft[_scKey],t=slider.querySelector(".sc-track").getBoundingClientRect();let v=(cx-t.left)/t.width;v=Math.max(0,Math.min(1,v));list[i].w=Math.round(v*200)/200;_scUpdateRow(i);};
  body.addEventListener("pointerdown",e=>{const sl=e.target.closest(".sc-slider");if(!sl)return;
    const i=+sl.closest(".sc-row").dataset.i;_scDrag={i,sl};sl.setPointerCapture(e.pointerId);setFromX(i,e.clientX,sl);e.preventDefault();});
  body.addEventListener("pointermove",e=>{if(_scDrag)setFromX(_scDrag.i,e.clientX,_scDrag.sl);});
  body.addEventListener("pointerup",()=>{_scDrag=null;});
  body.addEventListener("pointercancel",()=>{_scDrag=null;});
  body.addEventListener("keydown",e=>{const sl=e.target.closest(".sc-slider");if(!sl)return;
    const list=_scDraft[_scKey],i=+sl.closest(".sc-row").dataset.i;let step=0;
    if(e.key==="ArrowRight"||e.key==="ArrowUp")step=0.005;else if(e.key==="ArrowLeft"||e.key==="ArrowDown")step=-0.005;
    else if(e.key==="PageUp")step=0.05;else if(e.key==="PageDown")step=-0.05;
    else if(e.key==="Home"){list[i].w=0;_scUpdateRow(i);e.preventDefault();return;}
    else if(e.key==="End"){list[i].w=1;_scUpdateRow(i);e.preventDefault();return;}else return;
    list[i].w=Math.max(0,Math.min(1,list[i].w+step));_scUpdateRow(i);e.preventDefault();});}
{const _sb=$("#scoreCfgBtn");if(_sb)_sb.onclick=openScoreModal;}
document.addEventListener("click",e=>{const t=e.target;if(t&&t.closest&&t.closest("#ftwEdit"))openScoreModal();});
/* 로그인 — 비밀번호만으로 사용자 식별. cr_login이 {found,name,status,role,viewer} 반환:
   승인됨=데이터 열고 환영(권한별) · 신청함=승인 대기 · 거절됨=거절 안내 · 미존재=흔들기.
   0715=이름 없는 뷰어 · editor=마크·부가 캐시(canEdit) · 데이터 저장은 admin만(isAdmin — 서버도 동일 게이트) */
async function attemptLogin(pw){
  pw=(pw||"").trim();if(!pw)return "empty";
  let info;
  try{info=await sbRpc("cr_login",{p_pw:pw});}
  catch(e){toast("로그인 확인에 실패했어요 · "+(e.message||""));return "error";}
  if(!info||!info.found){toast("비밀번호가 맞지 않아요");return "wrong";}
  if(info.status==="신청함"){toast("아직 관리자 승인 대기 중이에요");return "pending";}
  if(info.status==="거절됨"){toast("가입이 거절된 계정이에요 · 관리자에게 문의해 주세요");return "rejected";}
  /* 비밀번호는 이 시점에 이미 확인됨 — 이후의 대기는 데이터 로드. 즉시 알려 체감 지연을 줄인다
     (성공 시 환영 인사가, 실패 시 오류 토스트가 이 문구를 자연히 대체) */
  toast("비밀번호 확인 ✓ — 로그인 성공, 최신 데이터를 불러오고 있어요…",20000);
  /* 승인됨 → 권한·이름 확정 (0715 뷰어는 이름 없음) */
  const viewer=!!info.viewer, name=viewer?"":(info.name||""), role=(info.role||"viewer");
  const editor=(role==="editor"||role==="admin"); /* 관리자는 에디터 권한 포함 */
  canEdit=editor; isAdmin=(role==="admin");
  uploaderId=name||null;try{if(name)localStorage.setItem("cr_uploader",name);else localStorage.removeItem("cr_uploader");}catch(_){}
  try{sessionStorage.setItem("crname",name);sessionStorage.setItem("crviewer",viewer?"1":"0");sessionStorage.setItem("crcan",editor?"1":"0");sessionStorage.setItem("crrole",role);}catch(_){}
  const ok=await cloudUnlock(pw,{name,viewer,editor});
  return ok?"ok":"error";}
const _pwForm=$("#pwForm");
if(_pwForm)_pwForm.addEventListener("submit",async e=>{e.preventDefault();
  const inp=$("#pwIn"),box=$("#pwForm"),go=$("#pwGo"),v=(inp.value||"").trim();if(!v)return;
  if(go)go.classList.add("busy");
  const res=await attemptLogin(v);
  if(go)go.classList.remove("busy");
  if(res==="ok"){updateLandingVisibility();}
  else if(res==="wrong"){box.classList.remove("err");void box.offsetWidth;box.classList.add("err");inp.select();}
  else{inp.select();}});
/* 회원가입 뷰 토글 */
const _toReg=$("#toRegister"),_toLogin=$("#toLogin"),_loginView=$("#loginView"),_regView=$("#registerView");
if(_toReg)_toReg.onclick=()=>{_loginView.hidden=true;_regView.hidden=false;setTimeout(()=>{const n=$("#regName");if(n)n.focus();},0);};
if(_toLogin)_toLogin.onclick=()=>{_regView.hidden=true;_loginView.hidden=false;setTimeout(()=>{const p=$("#pwIn");if(p)p.focus();},0);};
/* daangn name은 영문·숫자만 입력 가능(첫 글자 영문은 제출 시 검증) */
const _regName=$("#regName");
if(_regName)_regName.addEventListener("input",e=>{const c=e.target.selectionStart;e.target.value=e.target.value.replace(/[^A-Za-z0-9]/g,"");try{e.target.setSelectionRange(c,c);}catch(_){}});
async function doRegister(){
  const name=($("#regName").value||"").trim(),pw=$("#regPw").value||"",pw2=$("#regPw2").value||"";
  if(!/^[A-Za-z][A-Za-z0-9]{1,23}$/.test(name)){toast("daangn name은 영문으로 시작하는 2~24자 영문·숫자로 정해 주세요");$("#regName").focus();return;}
  if(!pwOk(pw)){toast("비밀번호는 4자 이상으로 정해 주세요");$("#regPw").focus();return;}
  if(pw!==pw2){toast("비밀번호와 비밀번호 확인이 서로 달라요");$("#regPw2").focus();return;}
  const btn=$("#doRegister"),bt=btn.textContent;btn.disabled=true;btn.textContent="신청 중…";
  try{
    await sbRpc("cr_register",{p_name:name,p_pw:pw});
    toast("가입 신청을 받았어요 · 관리자 승인 후 이용할 수 있어요");
    $("#regName").value="";$("#regPw").value="";$("#regPw2").value="";
    _regView.hidden=true;_loginView.hidden=false;setTimeout(()=>{const p=$("#pwIn");if(p)p.focus();},0);
  }catch(err){const m=(err&&err.message)||"";
    toast(m==="name_taken"?"이미 누군가 쓰고 있는 이름이에요":
          m==="pw_taken"?"이미 쓰이고 있는 비밀번호예요 · 다른 걸로 정해 주세요":
          m==="pw_reserved"?"그 비밀번호는 쓸 수 없어요 · 다른 걸로 정해 주세요":
          m==="name_invalid"?"daangn name 형식이 올바르지 않아요 (영문 시작, 2~24자)":
          (m==="pw_format"||m==="pw_weak")?"비밀번호는 4자 이상으로 정해 주세요":
          "가입 신청에 실패했어요 · "+m);
  }finally{btn.disabled=false;btn.textContent=bt;}}
const _doReg=$("#doRegister");if(_doReg)_doReg.onclick=doRegister;
["regName","regPw","regPw2"].forEach(id=>{const el=$("#"+id);if(el)el.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();doRegister();}});});
const _cloudLine=$("#cloudLine");
if(_cloudLine)_cloudLine.addEventListener("click",cloudRestore);
const _fmtBack=$("#fmtBarBack");
if(_fmtBack)_fmtBack.addEventListener("click",cloudRestore);
refreshCloudLine();
if(cloudPw){
  /* 부팅이 어떤 이유로든 안 끝나면(네트워크 지연 등) 로딩 화면에 갇히지 않도록 안전 타이머로 강제 해제 */
  setTimeout(()=>{if(cloudBooting){cloudBooting=false;updateLandingVisibility();}},35000);
  cloudUnlock(cloudPw,{silent:true}).catch(()=>false).then(()=>{cloudBooting=false;updateLandingVisibility();});}
else cloudBooting=false;
const _origSetActive2=setActive;setActive=function(k){_origSetActive2(k);updateLandingVisibility();};
